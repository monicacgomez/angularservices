<h1 style="color: #3f724e">Service Comics JSON</h1>

@for (comic of arrayComics; track comic) {
    <h4 style="color:rgba(26, 70, 46, 0.699)">
        {{ comic.nombre }}
    </h4>

    <p>{{ comic.descripcion }}</p>

    <img
        [src]="comic.imagen"
        style="width:80px; height:100px;"
        [alt]="comic.nombre"
    />
}
